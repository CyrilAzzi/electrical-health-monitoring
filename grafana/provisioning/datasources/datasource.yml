apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: ehm-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ehm_db
    user: ehm_user
    secureJsonData:
      password: ehm_password
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
